openapi: 3.1.0
info:
  title: AI Life OS Intake API
  version: 0.1.0
  description: Push important ChatGPT conversation context into AI Life OS.
servers:
  - url: https://ai-life-os-intake.onrender.com
paths:
  /api/lifeos/intake:
    post:
      operationId: pushLifeOSIntake
      summary: Push an important life update into AI Life OS.
      description: Use this when the user shares a task, deadline, event, goal, constraint, state change, or planning decision that should affect Now Card or Today Timeline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - rawInput
                - source
              properties:
                rawInput:
                  type: string
                  description: The user's exact message or a concise excerpt that should update AIOS.
                source:
                  type: string
                  enum:
                    - chatgpt
                timestamp:
                  type: string
                  format: date-time
                  description: Current timestamp. If omitted, AIOS will use server time.
                conversationSummary:
                  type: string
                  description: Short context summary when the raw input depends on earlier conversation.
                externalConversationId:
                  type: string
                  description: Optional ChatGPT conversation identifier or user-visible reference.
      responses:
        "200":
          description: Intake accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  accepted:
                    type: boolean
                  message:
                    type: string
        "400":
          description: Invalid request.
components:
  securitySchemes:
    LifeOSToken:
      type: apiKey
      in: header
      name: x-lifeos-token
security:
  - LifeOSToken: []
