services:
  - type: web
    name: ai-life-os-intake
    runtime: docker
    rootDir: expo
    dockerfilePath: ./Dockerfile.intake
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8787
      - key: LIFEOS_INTAKES_FILE
        value: /tmp/intakes.json
      - key: LIFEOS_INTAKE_TOKEN
        sync: false
